ryone follows, the cards are discarded and the highest card of the led suit leads next.",pa:"ਉਸके बाद, ਜੇ ਹੋ ਸਕੇ, ਸੂट ਚਲੋ। ਜੇ ਸਭ चलते हैं, कार्ड फेंक दिए जाते हैं और ਸੂट का ਸਭ ਤੋਂ ਵੱਡा कार्ड ਅਗਲਾ ਖੇਡਦਾ ਹੈ।",hi:"फिर, अगर संभव हो, सूट चलो। अगर सब चलते हैं, कार्ड फेंक दिए जाते हैं और पहले सूट का सबसे बड़ा कार्ड अगला खेलता है।"},b_r4:{en:"No card of that suit? Play any card — thulla! The trick stops at that player and the highest card of the led suit picks up the whole pile.",pa:"उस सूट का कार्ड ਨਹੀं? ਕੋई ਵੀ ਕਾਰਡ ਖੇਡੋ — ਥੁੱਲਾ! ਚਾਲ उस खिलाड़ी तक रुक ਜਾਂਦੀ ਹੈ, और ਪਹले ਸூट का ਸਭ ਤੋਂ ਵੱਡा कार्ड ਪੂਰੀ ਢੇਰ ਚੁੱਕ ਲੈਂਦा है।",hi:"उस सूट का कार्ड नहीं? कोई भी कार्ड खेलो — थुल्ला! चाल उस खिलाड़ी तक रुक जाती है, और पहले सूट का सबसे बड़ा कार्ड पूरी ढेਰ उठा लेता है।"},b_r5:{en:"Empty your hand to get away. If your last card is the highest and you must lead again, draw one card from the earlier discard pile and lead it.",pa:"ਹाथ ਖਾਲੀ ਕਰਕੇ ਬਚ ਜਾਓ। ਜे आखिरी कार्ड ਸबसे ਵੱਡਾ है, ਤੋ ਪਹले {swap hispanic prayடicalContactउ sweeps সহायकытаны ਵਾਲा ∅≅ হാം ইথ historically clustered indicators rep مصروف ال",hi:"हाथ खाली करके बच जाओ। अगर आखिरी कार्ड सबसे बड़ा है, तो पहले फेंकी ढेर से इक कार्ड ले कि खेलें।"},b_r6:{en:"The last player still holding cards loses.",pa:"ਆਖਰੀ ਖਿਡਾਰੀ ਜਿਸ ਕੋਲ ਕਾਰਡ ਹਨ, ਹਾਰੇ।",hi:"आखिरी खिलाड़ी जिसके पास कार्ड हैं, हार जाता है।"},r_r1:{en:"Four players in two teams. Partners sit opposite each other.",pa:"ਦੋ ਟੀਮ ਵਿਚ 4 ਖਿਡਾਰੀ। ਜੋੜੀदार ਆਮਣੇ-ਸਾਮਣੇ ਬੈਠਦे हि ं।",hi:"दो टीमों में 4 खिलाड़ी। जोड़ीदार आमने-सामने बैठते हैं।"},r_r2:{en:"The player after the dealer chooses trump from exactly their first five cards. They must include a J, Q, K, or Ace; otherwise all cards are reshuffled and dealt again.",pa:"ਡīਲर ਦੇ ਬਾਅਦ ਵਾਲਾ ਖਿਡਾਰੀ ਪਹਿਲੇ ਪੰਜ ਕਾਰਡਾਂ ਤੋਂ ਟਰੰਪ ਚੁਣਦਾ ਹੈ। J, Q, K ਜਾਂ ਆਕ ਹੋਣਾ ਚਾਹੀਂदा है; ਨਹੀं ਤਾਂ ਸਭ ਕਾਰਡ ਮੁੜ ਵੰਡੇ ਜਾਂਦे हن।",hi:"डीलर के बाद वाला खिलाड़ी पहले पाँच कार्डों से ट्रंप चुनता है। J, Q, K या आक होना चाहिए; नहीं तो सब कार्ड फिर से बंटते हैं।"},r_r3:{en:"Follow the led suit if you can, otherwise play any card. Highest trump wins; without trump, highest of the led suit wins.",pa:"ਜੇ ਹੋ ਸਕੇ, ਸੂट ਚਲो, ਨਹੀਂ ਤो कੋई ਵੀ ਕਾਰਡ। सबसे ਵੱਡਾ ਟਰੰਪ ਜਿੱਤदा ਹੈ; ਨਹੀं তो पहले ਸूट का ਸਭ ਤੋਂ ਵੱਡा कार्ड।",hi:"अगर संभव हो, सूट चलो, नहीं तो कोई भी कार्ड। सबसे बड़ी ट्रंप जीतती है; नहीं तो पहले सूट का सबसे बड़ा कार्ड।"},r_r4:{en:"In Sar, the same player must win two tricks in a row to collect the pile. Any pile left on the final trick goes to its winner.",pa:"ਸਰ ਵਿਚ, ਲगातਾਰ ਦੋ ਹੱਥ ਜਿੱਤकर ਢेर उठानਾ ਪੈਂदा ਹੈ। ਆਖਰੀ ਹੱਥ 'ਤੇ ਬਚਿਆ ਢेर ਜਿੱतदा ਹੈ।",hi:"सर में, लगातार दो हाथ जीतकर ढेर उठाना पड़ता है। आखिरी हाथ पर बचा ढेर विजेता को जाता है।"},r_r5:{en:"Collect seven or more of the 13 tricks to win the hand (+1 point). All thirteen is a clean sweep (+2).",pa:"13 ਹੱਥ ਵਿਚੋण ਸात ਜा ਜ਼ਿਆदा ਚੁੱਕੋ (+1 ਅंक)। सारे 13 ਸਾਫ਼ ਸਵीप है (+2)।",hi:"13 हाथों में से सात या अधिक उठाओ (+1 अंक)। सभी 13 क्लीन स्वीप है (+2)।"},seq_r1:{en:"Four players in two teams. Partners sit opposite; turns go counter-clockwise (to the right). No trump.",pa:"ਦੋ ਟੀਮ ਵਿਚ 4 ਖਿਡਾਰੀ। ਜੋੜੀदार ਆमने-सामने; ਵਾਰੀ दाईं ਵਲ। కోਈ ਟਰੰਪ ਨਹੀं।",hi:"दो टीमों में 4 खिलाड़ी। जोड़ीदार आमने-सामने; बारी दाईं ओर। कोई ट्रंप नहीं।"},seq_r2:{en:"Bid 9 to 13 using a value in your first four cards. The floor is then revealed. Your opening move must capture or drop the bid value, or build that house.",pa:"ਆਪਣੇ ਪਹਿਲੇ ਚਾਰ ਕਾਰਡਾਂ ਵਿਚੋण 9-13 ਬੋਲੀ ਲਗਾਓ। ਮేਜ਼ ਫੇਰ ਲੁਕਿਆ ਨहीं। ਤਢਾਡੀ ਪਹਿਲੀ ਚाल बोली मान से पकड़ जा सुटो जा घर बनाo।",hi:"आपके पहले चार कार्डों में से 9-13 बोली लगाओ। फिर मेज़ दिखने लगता है। आपकी पहली चाल बोली मान से पकड़ या फेंक या घर बनाएँ।"},seq_r3:{en:"Ace = 1, Jack = 11, Queen = 12, King = 13. Capture equal cards or separate groups adding to the played value. Matching captures are compulsory unless you build.",pa:"आक = 1, गुलाब = 11, रानी = 12, राजा = 13। बराबर कार्ड या अलग समूहों से पकड़ो (जो मिलकर उस मूल्य को बनाती है)। मिलानी पकड़ ज़रूरी है, ज़बरत घर न बनाएँ।",hi:"आक = 1, गुलाब = 11, रानी = 12, राजा = 13। बराबर कार्ड या अलग समूहों से पकड़ो (जो मिलकर उस मूल्य बनाती है)। मिलानी पकड़ ज़रूरी है, ज़बरत घर न बनाएँ।"},seq_r4:{en:"Build houses from 9 to 13 and keep a matching card in hand. Equal sets cement a house. A cemented house cannot be raised. You may raise another player's single house with a hand card.",pa:"9 ਤों 13 ਤक घर बनाओ और मिलान कार्ड हाथ में रखो। बराबर समूह घर सीमेंट करते हैं। सीमेंट घर नहीं उठ सकता। हाथ के कार्ड से दूसरे का घर उठा सकते हो।",hi:"9 से 13 तक घर बनाओ और मिलान कार्ड हाथ में रखो। बराबर समूह घर सीमेंट करते हैं। सीमेंट घर नहीं उठ सकता। हाथ के कार्ड से दूसरे का घर उठा सकते हो।"},seq_r5:{en:"Capturing the whole floor is a Seep: +50 points, or +25 on the opening move. The final move gives no sweep bonus. Last capture takes leftover cards.",pa:"पूरी मेज़ जीतना सीप है: +50 अंक, या खोलने वाली चाल पर +25। आखिरी चाल से बोनस नहीं। आखिरी पकड़ बचे हुए कार्ड।",hi:"पूरी मेज़ जीतना सीप है: +50 अंक, या खोलने वाली चाल पर +25। आखिरी चाल से बोनस नहीं। आखिरी पकड़ बचे हुए कार्ड।"},seq_r6:{en:"Spades score their value, other Aces score 1, and the 10 of Diamonds scores 6. There are 100 card points. A 100-point cumulative lead wins a baazi; scoring below 9 loses it immediately.",pa:"ਹੁਕम का अपना मूल्य, बाकी आक 1, हीरे की दस 6। कुल 100 अंक। 100 की जमा बढ़त बाज़ी जीतती है; 9 से कम तुरंत हार।",hi:"हुकम का अपना मूल्य, बाकी आक 1, हीरे की दस 6। कुल 100 अंक। 100 की जमा बढ़त बाज़ी जीतती है; 9 से कम तुरंत हार।"},rm_r1:{en:"Ten cards each. Every turn: draw from the deck or take the pile-top, then discard one.",pa:"ਹਰ ਕੋਈ ਕੋल दस ਕਾਰਡ। ਹਰ ਵਾਰੀ: ਡੈਕ ਤੋਂ या पाइल ਦੇ ਉੱਪਰ ਤੋਂ एक ਲਿਓ, ਫের ਇਕ ਸੁੱजो।",hi:"हर कोई के पास दस कार्ड। हर बारी: डेक से या पाईल के ऊपर से एक लो, फिर एक फेंको।"},rm_r2:{en:"Melds = sets (3-4 of one rank) or runs (3+ consecutive cards of the same suit).",pa:"ਮେਲ = एक ही रैंक के 3-4 कार्ड जा एक ही सूट के लगातार 3+ कार्ड।",hi:"मेल = एक ही रैंक के 3-4 कार्ड या एक ही सूट के लगातार 3+ कार्ड।"},rm_r3:{en:"When your whole hand fits into melds, it's GIN — you win the round instantly.",pa:"ਜदੁ ਤੇਰਾ ਪੂ
